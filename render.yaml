# Render blueprint for the backend API. The frontend is deployed on Vercel (see README, "Deploy").
services:
  - type: web
    name: upi-safety-check-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Free plan (512 MB). The app uses about 300 MB without PyTorch. Free services sleep after 15 minutes without visits.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # lets any *.vercel.app address call the API; set CORS_ORIGINS too if you add a custom domain
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
